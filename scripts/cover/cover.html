<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToDos Board cover</title>
    <!-- The catalog cover, 1600×1000. `bun run cover` serves this page next to a demo build of the
         board (board.html, sample data) and captures it to images/cover.png. -->
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('dist/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
      }
      :root {
        --bg: oklch(0.13 0.005 280);
        --fg: oklch(0.97 0 0);
        --muted-fg: oklch(0.72 0.01 280);
        --line: oklch(1 0 0 / 12%);
        --brand: oklch(0.56 0.17 280);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1600px;
        height: 1000px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(900px 600px at 78% 8%, color-mix(in oklab, var(--brand) 28%, transparent), transparent 70%),
          var(--bg);
        color: var(--fg);
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .copy {
        position: absolute;
        left: 88px;
        top: 112px;
        width: 452px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
      }
      h1 {
        margin-top: 56px;
        font-size: 58px;
        line-height: 1.04;
        font-weight: 650;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .lede {
        margin-top: 24px;
        font-size: 21px;
        line-height: 1.45;
        color: var(--muted-fg);
        text-wrap: pretty;
      }
      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 40px;
        padding: 0;
        list-style: none;
      }
      .features li {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 16px;
        color: color-mix(in oklab, var(--fg) 88%, var(--muted-fg));
        background: oklch(1 0 0 / 3%);
      }
      .features code {
        font-family: inherit;
        color: var(--muted-fg);
      }
      /* The real app: the board tab bleeding off the right and bottom edges, and the sidebar panel
         over its empty lower corner. Each frame draws at a larger size and is scaled down, so the
         board fits all four columns. */
      .window {
        position: absolute;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: var(--bg);
        box-shadow:
          0 0 0 1px oklch(0 0 0 / 40%),
          0 40px 120px -20px oklch(0 0 0 / 70%);
      }
      .window iframe {
        width: calc(100% / var(--scale));
        height: calc(100% / var(--scale));
        border: 0;
        display: block;
        transform: scale(var(--scale));
        transform-origin: 0 0;
      }
      .window--board {
        --scale: 0.82;
        left: 604px;
        top: 96px;
        width: 1260px;
        height: 960px;
      }
      .window--panel {
        --scale: 0.9;
        left: 1196px;
        top: 486px;
        width: 336px;
        height: 560px;
        box-shadow:
          0 0 0 1px oklch(0 0 0 / 50%),
          0 30px 90px -10px oklch(0 0 0 / 85%);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="images/icon.png" alt="" />ToDos Board</div>
      <h1>Your next steps, beside your agents.</h1>
      <p class="lede">
        To-dos in the sidebar and a board tab, with your own states. Start a coding agent from any to-do and follow it
        there.
      </p>
      <ul class="features">
        <li>List and board</li>
        <li>Custom states</li>
        <li>Checklists</li>
        <li>Quick add <code>#tag !high</code></li>
        <li>Start agents</li>
        <li>Status bar count</li>
      </ul>
    </div>
    <div class="window window--board"><iframe src="board.html" title="The ToDos board tab"></iframe></div>
    <div class="window window--panel"><iframe src="panel.html" title="The ToDos sidebar panel"></iframe></div>
  </body>
</html>
